<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/gerenciamentoDeUsuarios.css">
    <link rel="stylesheet" href="../css/relatorios.css">
    <link rel="shortcut icon" href="../imagens/shortLigthLogo.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/headerPosLogin.css">
    <script src="../js/acessoGeral.js" defer></script>
    <script src="../js/relatorio.js" defer></script>
    <title>MonTech - gerenciamento de usuários</title>
</head>

<body onload="carregarInformacoes()">
    <header>
        <div id="logoHeader"></div>
        <hr>
        <div id="containerOpcoes">
            <div class="opcao">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-graph-up" viewBox="0 0 16 16">

                    <path fill-rule="evenodd"
                        d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07" />

                </svg>

                <span>Dashboard</span>
            </div>

            <div class="opcao">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-people"
                    viewBox="0 0 16 16">

                    <path
                        d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4" />

                </svg>

                <a href="gerenciamentoDeUsuarios.html" style="text-decoration: none; color: inherit;">
                    <span>Gerenciar Usuários</span>
                </a>
            </div>

            <div class="opcao">

                <img src="../imagens/sino.png" alt="Alertas" width="16" height="16">

                <a href="alertas.html" style="text-decoration: none; color: inherit;">
                    <span>Alertas</span>
                </a>

            </div>

            <div class="opcao" id="opcaoAtiva">
                <img src="../imagens/relatorio.png" alt="Relatórios" width="16" height="16">

                <a href="relatorios.html" style="text-decoration: none; color: inherit;">
                    <span>Relatórios</span>
                </a>

            </div>

            <div class="opcao">
                <img src="../imagens/servidor.png" alt="Cadastrar Servidor" width="16" height="16">

                <a href="cadastroDeServidor.html" style="text-decoration: none; color: inherit;">
                    <span>Cadastrar Servidores</span>
                </a>

            </div>
        </div>

        <div id="footerHeader">
            <div id="containerUsuario">

                <div id="usuarioFoto">

                    <img src="../imagens/fotoUsuario.png" alt="Foto do usuário">

                </div>
                <div id="user_info">

                    <a id="nomeUsuario">Gabriel Galhiardo</a>

                    <span id="cargoUsuario">Administrador</span>

                </div>
            </div>

            <div id="containerSair" onclick="sair()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-box-arrow-right" viewBox="0 0 16 16">

                    <path fill-rule="evenodd"
                        d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z" />

                    <path fill-rule="evenodd"
                        d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z" />

                </svg>

                <a href="#" style="text-decoration: none; color: inherit;">
                    <span>Sair</span>
                </a>
            </div>
        </div>
    </header>

    <div class="relatoriosCabecalho">
        <div class="relatoriosElementos">
            <h1 class="tituloRelatorio">Relatórios</h1>
            <span class="descricao">Visualize e gerencia os relatórios gerados</span>
        </div>
        <div class="botaoRelatorioDiv">
            <div class="botaoRelatorioElementos">
                <button class="botaoRelatorio" onclick="abrirModalRelatorio()">
                    Cadastrar Relatório
                </button>
            </div>
        </div>
    </div>

    <div class="secaoRelatorios">
        <div class="secaoElementos">
        </div>
    </div>

    <div id="modalRelatorio" class="modalRelatorio">
        <div class="modalConteudo">
            <div class="modalCabecalho">
                <div>
                    <h2>Novo Relatório</h2>
                    <span>Preencha as informações para cadastrar um novo relatório.</span>
                </div>

                <button class="fecharModal" onclick="fecharModalRelatorio()">×</button>
            </div>

            <div class="formularioRelatorio">
                <div class="campoRelatorio">
                    <label for="tituloRelatorioInput">Título do Relatório</label>
                    <input type="text" id="tituloRelatorioInput" placeholder="Ex: Análise de Desempenho">
                </div>

                <div class="campoRelatorio">
                    <label for="tipoRelatorioInput">Tipo de Relatório</label>
                    <select id="tipoRelatorioInput">
                        <option value="">Selecione o tipo</option>
                        <option value="Desempenho">Desempenho</option>
                        <option value="Segurança">Segurança</option>
                        <option value="Falha Física">Falha Física</option>
                        <option value="Falha Virtual">Falha Virtual</option>
                    </select>
                </div>

                <div class="campoRelatorio">
                    <label for="dataRelatorioInput">Data do Relatório</label>
                    <input type="date" id="dataRelatorioInput">
                </div>

                <div class="campoRelatorio">
                    <label for="statusRelatorioInput">Status da Análise</label>
                    <select id="statusRelatorioInput">
                        <option value="">Selecione o status</option>
                        <option value="Em Análise">Em Análise</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>

                <div class="campoRelatorio campoCompleto">
                    <label for="resumoRelatorioInput">Resumo</label>
                    <input type="text" id="resumoRelatorioInput" placeholder="Digite um resumo sobre o relatório...">
                </div>

                <div class="campoRelatorio campoCompleto">
                    <label for="observacoesRelatorioInput">Descrição / Observações</label>
                    <input type="text" id="observacoesRelatorioInput"
                        placeholder="Adicione informações complementares...">
                </div>
            </div>

            <div class="acoesModal">
                <button class="botaoCancelar" onclick="fecharModalRelatorio()">Cancelar</button>

                <button class="botaoSalvar" onclick="salvarRelatorio()">Salvar Relatório</button>
            </div>
        </div>
    </div>

    <div id="modalLeituraRelatorio" class="modalRelatorio">
        <div class="modalLeituraConteudo">
            <div class="modalCabecalho">
                <div>
                    <h2 id="tituloLeitura"></h2>
                    <span>Informações completas do relatório</span>
                </div>
                <button class="fecharModal" onclick="fecharModalLeitura()">×</button>
            </div>

            <div class="informacoesLeitura">
                <div>
                    <label>Tipo</label>
                    <span id="tipoLeitura"></span>
                </div>
                <div>
                    <label>Data</label>
                    <span id="dataLeitura"></span>
                </div>
                <div>
                    <label>Status</label>
                    <span id="statusLeitura"></span>
                </div>
                <div class="leituraCompleta">
                    <label>Resumo</label>
                    <p id="resumoLeitura"></p>
                </div>
                <div class="leituraCompleta">
                    <label>Descrição / Observações</label>
                    <p id="descricaoLeitura"></p>
                </div>
            </div>
            <div class="acoesModal">
                <button class="botaoCancelar" onclick="fecharModalLeitura()">
                    Fechar
                </button>
            </div>
        </div>
    </div>

</body>

</html>
