<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/gerenciamentoDeUsuarios.css">
    <link rel="shortcut icon" href="../imagens/shortLigthLogo.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <title>MonTech - gerenciamento de usuários</title>
</head>

<body>
    <header>
        <div id="header">
            <h1>MonTech</h1>
        </div>
    </header>

    <div id="containerGerenciamentoUsuarios">
        <div id="containerGerenciamentoUsuariosTitulo">
            <h1>Gerenciamento de usuários</h1>
            <button id="botaoCadastroUsuario">Adicionar Usuário</button>
        </div>

        <div id="containerGerenciamentoUsuariosTabela">
            <table>
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Status</th>
                        <th>Servidores</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <tr class="usuarioLinha">
                        <td>
                            <span class="usuarioNome">Gabriel Galhiardo</span>
                            <span class="usuarioEmail">gabriel@gmail.com</span>
                        </td>
                        <td class="usuarioStatusInativo">Ativo</td>
                        <td>
                            <span class="servidorInativo">Servidor 1</span>
                            <span class="servidorInativo">Servidor 2</span>
                            <span class="servidorInativo">Servidor 3</span>
                        </td>
                        <td class="usuario_acoes">
                            <button class="btn_acoes">Editar</button>
                        </td>
                    </tr>
                      <tr class="usuarioLinha">
                        <td>
                            <span class="usuarioNome">Gabriel Galhiardo</span>
                            <span class="usuarioEmail">gabriel@gmail.com</span>
                        </td>
                        <td class="usuarioStatusAtivo">Ativo</td>
                        <td>
                            <span class="servidorAtivo">Servidor 1</span>
                            <span class="servidorInativo">Servidor 2</span>
                            <span class="servidorAtivo">Servidor 3</span>
                        </td>
                        <td class="usuario_acoes">
                            <button class="btn_acoes">Editar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
