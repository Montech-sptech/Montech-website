<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/cadastroDeEmpresas.css">
    <link rel="stylesheet" href="../css/headerPosLogin.css">
    
    <link rel="shortcut icon" href="../imagens/shortLigthLogo.svg" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <script src="../js/acessoGeral.js" defer></script>
    <title>MonTech - cadastrar empresa</title>
</head>

<body onload="carregarInformacoes()">
    <header>
        <div id="logoHeader"></div>
        <hr>
        <div id="containerOpcoes">
            <div class="opcao">
                <a href="inicioCadastroEmpresa.html" style="text-decoration: none; color: inherit;">
                    <span>Inicio</span>
                </a>
            </div>

            <div class="opcao">
                <a href="contatoEmpresas.html" style="text-decoration: none; color: inherit;">
                    <span>Contatos</span>
                </a>
            </div>

            <div class="opcao" id="opcaoAtiva">
                <a href="cadastroDeEmpresa.html" style="text-decoration: none; color: inherit;">
                    <span>Cadastrar Empresas</span>
                </a>
            </div>

            <div class="opcao">
                <a href="empresasCadastradas.html" style="text-decoration: none; color: inherit;">
                    <span>Empresas Cadastradas</span>
                </a>
            </div>

            <div class="opcao">
                <a href="usuariosDeClientes.html" style="text-decoration: none; color: inherit;">
                    <span>Usuários de Clientes</span>
                </a>
            </div>
        </div>

        <div id="footerHeader">
            <div id="containerUsuario">
                <div id="usuarioFoto">
                    <img src="../imagens/fotoUsuario.png" alt="Foto do usuário">
                </div>
                <div id="user_info">
                    <a id="nomeUsuario">Gabriel Galhiardo</a>
                    <span id="cargoUsuario">Administrador</span>
                </div>
            </div>

            <div id="containerSair">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z" />
                    <path fill-rule="evenodd"
                        d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z" />
                </svg>
                <a href="landingPage.html" style="text-decoration: none; color: inherit;">
                    <span>Sair</span>
                </a>
            </div>
        </div>
    </header>

    <div class="containerCadastroEmpresa">
        <div id="containerCadastroEmpresaTitulo">
            <h1>Cadastrar Empresa</h1>
        </div>

        <div class="containerFormEmpresa">

            <div class="linhaCampo">
                <label for="ipt_razao_social">Razão Social</label>
                <input type="text" id="ipt_razao_social" placeholder="nome oficial da empresa">
            </div>

            <div class="linhaCampo">
                <label for="ipt_cnpj">CNPJ</label>
                <input type="text" id="ipt_cnpj" placeholder="XX.XXX.XXX/XXXX-XX">
            </div>

            <div class="linhaCampoDupla">
                <div class="linhaCampo">
                    <label for="ipt_cep">CEP</label>
                    <input type="text" id="ipt_cep" placeholder="XXXXX-XXX">
                </div>

                <div class="linhaCampo">
                    <label for="ipt_numero">Número</label>
                    <input type="text" id="ipt_numero" placeholder="ex: 100">
                </div>
            </div>

            <div class="linhaCampo">
                <label>Código da empresa</label>
                <div class="codigoGerado">
                    <span id="codigo_gerado">gerado após o cadastro</span>
                </div>
            </div>

            <div id="erro" class="mensagemErro"></div>
            <div id="sucesso" class="mensagemSucesso"></div>

            <button id="botaoCadastrarEmpresa" onclick="cadastrar()">Cadastrar Empresa</button>

        </div>
    </div>

    <script>
        function cadastrar() {
            var razaoSocial = ipt_razao_social.value;
            var cnpj = ipt_cnpj.value;
            var cep = ipt_cep.value;
            var numero = ipt_numero.value;
            var erro = document.getElementById("erro");
            var sucesso = document.getElementById("sucesso");

            erro.innerHTML = "";
            sucesso.innerHTML = "";

            if (
                razaoSocial == "" ||
                cnpj == "" ||
                cep == "" ||
                numero == ""
            ) {
                erro.innerHTML = "Há campos em branco. Por favor, preencha todos os dados.";
                return false;
            }

            fetch("/cadastroEmpresas/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    razaoSocialServer: razaoSocial,
                    cnpjServer: cnpj,
                    cepServer: cep,
                    numeroServer: numero
                }),
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (dados) {
                            document.getElementById("codigo_gerado").innerHTML = dados.codigo_empresa;
                            sucesso.innerHTML = "Cadastro realizado!";

                            ipt_razao_social.value = "";
                            ipt_cnpj.value = "";
                            ipt_cep.value = "";
                            ipt_numero.value = "";
                        });
                    } else {
                        resposta.text().then(texto => {
                            erro.innerHTML = "Erro ao cadastrar: " + texto;
                        });
                    }
                })
                .catch(function (err) {
                    console.log(`#ERRO: ${err}`);
                    erro.innerHTML = "Erro de conexão com o servidor.";
                });

            return false;
        }
    </script>

</body>

</html>
