    <script src="../js/sidebarGerenciamento.js" defer></script>
    <title>MonTech - gerenciamento de usuários</title>
  </head>

  <body
    onload="(pegarUsuariosPeloAdministrador(), carregarServidoresDoAeroporto())"
  >
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">

      <nav class="sbNav">
        <a class="sbItem" href="#" data-cargos="Administrador,Analista">

              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
              />
              <path d="M14 2v6h6" />
              <path d="M8 18v-2" />
              <path d="M12 18v-4" />
              <path d="M16 18v-6" />
            </svg>
          </span>
          <span class="sbRotulo">Relatórios</span>
          <svg

            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </a>
        <a
          class="sbItem"
          href="gerenciamentoDeUsuarios.html"

        >
          <span class="sbIcone">
            <svg
              xmlns="http://www.w3.org/2000/svg"

          </span>
          <span class="sbRotulo">Usuários</span>
          <svg
            class="sbSeta"
            xmlns="http://www.w3.org/2000/svg"

            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"

            aria-hidden="true"

            <path d="m9 18 6-6-6-6" />

        <a
          class="sbItem"

          data-cargos="Administrador,Analista"
        >
          <span class="sbIcone">
            <svg
              xmlns="http://www.w3.org/2000/svg"

              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />

          <svg
            class="sbSeta"

        <a
          class="sbItem"
          href="cadastroDeServidor.html"
          data-cargos="Administrador"
          data-titulo="Cadastrar Servidores"
        >
          <span class="sbIcone">
            <svg
              xmlns="http://www.w3.org/2000/svg"

              <ellipse cx="12" cy="5" rx="9" ry="3" />

      <div class="sbRodape">
        <div class="sbRodapeFundo"></div>
        <button class="sbSair" id="sbSair" type="button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          <span class="sbRotulo">Sair</span>
        </button>
      </div>
    </aside>

    <main class="containerGerenciamentoUsuarios">
      <div id="containerGerenciamentoUsuariosTitulo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M16 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-8 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm0 2c-2.7 0-8 1.3-8 4v2.5c0 .8.7 1.5 1.5 1.5h13c.8 0 1.5-.7 1.5-1.5V17c0-2.7-5.3-4-8-4Zm8 0c-.4 0-.9 0-1.4.1 1.6 1.2 2.4 2.7 2.4 3.9v3h5.5c.8 0 1.5-.7 1.5-1.5V17c0-2.7-5.3-4-8-4Z"
          />
        </svg>
        <h1>Gerenciamento de Usuários</h1>
      </div>

      <section class="cartaoUsuarios">
        <div class="barraFerramentas">
          <h2>Usuários do Sistema</h2>

          <div class="acoesFerramentas">
            <label class="campoBusca">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                type="search"
                id="inputBuscaUsuario"
                placeholder="Buscar usuário..."
                aria-label="Buscar usuário"
                oninput="buscarUsuarios(this.value)"
                autocomplete="off"
              />
            </label>

            <button
              class="btnNovoUsuario"
              type="button"
              onclick="abrirModalNovoUsuario()"
            >
              <span>Novo Usuário</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14M12 5v14" />
              </svg>
            </button>
          </div>
        </div>

        <div class="containerTabela">
          <div class="tabelaDados" id="tabelaUsuarios">
            <div class="linhaCabecalho">
              <div class="col colUsuario">
                <button
                  class="btnOrdenar"
                  type="button"
                  data-campo="nome"
                  onclick="ordenarUsuarios('nome')"
                >
                  Usuário
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path class="setaCima" d="m7 9 5-5 5 5" />
                    <path class="setaBaixo" d="m7 15 5 5 5-5" />
                  </svg>
                </button>
              </div>
              <div class="col colEmail">
                <button
                  class="btnOrdenar"
                  type="button"
                  data-campo="email"
                  onclick="ordenarUsuarios('email')"
                >
                  Email
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path class="setaCima" d="m7 9 5-5 5 5" />
                    <path class="setaBaixo" d="m7 15 5 5 5-5" />
                  </svg>
                </button>
              </div>
              <div class="col colCargo">
                <button
                  class="btnOrdenar"
                  type="button"
                  data-campo="cargo"
                  onclick="ordenarUsuarios('cargo')"
                >
                  Cargo
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path class="setaCima" d="m7 9 5-5 5 5" />
                    <path class="setaBaixo" d="m7 15 5 5 5-5" />
                  </svg>
                </button>
              </div>
              <div class="col colStatus">
                <button
                  class="btnOrdenar"
                  type="button"
                  data-campo="status"
                  onclick="ordenarUsuarios('status')"
                >
                  Status
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path class="setaCima" d="m7 9 5-5 5 5" />
                    <path class="setaBaixo" d="m7 15 5 5 5-5" />
                  </svg>
                </button>
              </div>
              <div class="col colUltimoAcesso">
                <button
                  class="btnOrdenar"
                  type="button"
                  data-campo="ultimoAcesso"
                  onclick="ordenarUsuarios('ultimoAcesso')"
                >
                  Último Acesso
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path class="setaCima" d="m7 9 5-5 5 5" />
                    <path class="setaBaixo" d="m7 15 5 5 5-5" />
                  </svg>
                </button>
              </div>
              <div class="col colAcoes">Ações</div>
            </div>

            <div id="listaUsuarios">
              <div class="estadoVazio">Carregando usuários...</div>
            </div>
          </div>
        </div>

        <div class="rodapeTabela">
          <span class="infoPaginacao" id="infoPaginacao"></span>
          <nav class="paginacao" id="paginacao" aria-label="Paginação"></nav>
        </div>
      </section>
    </main>

    <div id="modalEdicao" class="escondido">
      <div id="modalEditarUsuario">
        <svg
          id="iconeFecharModal"
          onclick="fecharModalEdicao()"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="#6f6d82"
          viewBox="0 0 16 16"
        >
          <path
            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"
          />
        </svg>

        <h2>Editar usuario</h2>

        <div class="formModal">
          <div class="campoModal">
            <label for="inputNomeModal">NOME</label>
            <input type="text" id="inputNomeModal" value="Gabriel Galhiardo" />
          </div>

          <div class="campoModal">
            <label for="inputEmailModal">E-MAIL</label>
            <input
              type="email"
              id="inputEmailModal"
              value="gabriel@gmail.com"
            />
          </div>

          <div class="campoModal">
            <label for="selectStatusModal">Status</label>
            <select id="selectStatusModal">
              <option value="inativo" selected>Inativo</option>
              <option value="ativo">Ativo</option>
            </select>
          </div>

          <div class="campoModal">
            <label>Acesso ao servidores</label>

            <div class="gridServidoresModal">
              <label class="checkboxServidor">
                <input
                  type="checkbox"
                  value="1"
                  class="inputServidorCheckbox"
                  onchange="alternarVisualCheckbox(this)"
                />
                <span class="nomeServidorModal">Servidor A</span>
              </label>

              <label class="checkboxServidor">
                <input
                  type="checkbox"
                  value="2"
                  class="inputServidorCheckbox"
                  onchange="alternarVisualCheckbox(this)"
                />
                <span class="nomeServidorModal">Servidor B</span>
              </label>

              <label class="checkboxServidor">
                <input
                  type="checkbox"
                  value="3"
                  class="inputServidorCheckbox"
                  onchange="alternarVisualCheckbox(this)"
                />
                <span class="nomeServidorModal">Servidor C</span>
              </label>
            </div>
          </div>
        </div>

        <div class="containerAcoesModal">
          <button id="botaoSalvarModal" onclick="salvarEdicaoUsuario()">
            SALVAR MUDANÇAS
          </button>
          <button id="botaoCancelarModal" onclick="fecharModalEdicao()">
            CANCELAR
          </button>
        </div>
      </div>
    </div>
    <div id="modalExclusao" class="escondido">
      <div id="modalExcluirUsuario">
        <svg
          id="iconeFecharModalExclusao"
          onclick="fecharModalExclusao()"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="#6f6d82"
          viewBox="0 0 16 16"
        >
          <path
            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"
          />
        </svg>

        <h2>Excluir usuário</h2>
        <p id="textoConfirmacaoExclusao"></p>

        <div class="containerAcoesModal">
          <button
            id="botaoConfirmarExclusao"
            onclick="confirmarExclusaoUsuario()"
          >
            EXCLUIR
          </button>
          <button id="botaoCancelarExclusao" onclick="fecharModalExclusao()">
            CANCELAR
          </button>
        </div>
      </div>
    </div>

    <div id="modalFotoPerfil" class="escondido">
      <div id="modalEscolherFoto">
        <svg
          id="iconeFecharModalFoto"
          onclick="fecharModalFotoPerfil()"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="#6f6d82"
          viewBox="0 0 16 16"
        >
          <path
            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"
          />
        </svg>
        <h2>Escolher foto de perfil</h2>
        <div id="gridFotosPerfil"></div>
        <div class="containerAcoesModal">
          <button id="botaoSalvarFotoPerfil" onclick="salvarFotoPerfil()">
            SALVAR
          </button>
          <button
            id="botaoCancelarFotoPerfil"
            onclick="fecharModalFotoPerfil()"
          >
            CANCELAR
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
