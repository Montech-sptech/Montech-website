<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/gerenciamentoDeUsuarios.css">
    <link rel="shortcut icon" href="../imagens/shortLigthLogo.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <title>MonTech - gerenciamento de usuários</title>
</head>

<body>
    <header>
        <div id="header">
            <h1>MonTech</h1>
        </div>
    </header>

    <div id="containerGerenciamentoUsuarios">
        <div id="containerGerenciamentoUsuariosTitulo">
            <h1>Gerenciamento de usuários</h1>
            <button id="botaoCadastroUsuario">Adicionar Usuário</button>
        </div>


        <div class="containerTabela">
            <div class="tabelaDados" id="tabelaUsuarios">
                <div class="linhaCabecalho">
                    <div class="col">Usuário</div>
                    <div class="col">Status</div>
                    <div class="col">Servidores</div>
                    <div class="col">Ações</div>
                </div>

                <div class="linhaUsuario">
                    <div class="col">
                        <span class="usuarioNome">Gabriel Galhiardo</span>
                        <span class="usuarioEmail">gabriel@gmail.com</span>
                    </div>
                    <div class="col">
                        <span class="status ativo">Ativo</span>
                    </div>
                    <div class="col">
                        <div class="servidores">
                            <span class="servidor ativo">Captura</span>
                            <span class="servidor ativo">Processamento</span>
                            <span class="servidor ativo">Exibição</span>
                        </div>
                    </div>
                    <div class="col">
                        <button class="btnEditar">Editar</button>
                    </div>
                </div>

                <div class="linhaUsuario">
                    <div class="col">
                        <span class="usuarioNome">Gabriel Galhiardo</span>
                        <span class="usuarioEmail">gabriel@gmail.com</span>
                    </div>
                    <div class="col">
                        <span class="status inativo">Inativo</span>
                    </div>
                    <div class="col">
                        <div class="servidores">
                            <span class="servidor ativo">Captura</span>
                            <span class="servidor ativo">Processamento</span>
                            <span class="servidor inativo">Exibição</span>
                        </div>
                    </div>
                    <div class="col">
                        <button class="btnEditar">Editar</button>
                    </div>
                </div>

                <div class="linhaUsuario">
                    <div class="col">
                        <span class="usuarioNome">Gabriel Galhiardo</span>
                        <span class="usuarioEmail">gabriel@gmail.com</span>
                    </div>
                    <div class="col">
                        <span class="status ativo">Ativo</span>
                    </div>
                    <div class="col">
                        <div class="servidores">
                            <span class="servidor ativo">Captura</span>
                            <span class="servidor ativo">Processamento</span>
                            <span class="servidor ativo">Exibição</span>
                        </div>
                    </div>
                    <div class="col">
                        <button class="btnEditar">Editar</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
