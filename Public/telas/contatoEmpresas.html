</head>

<body onload="carregarInformacoes(); carregarMensagens();">
    <header>
        <div id="logoHeader"></div>
        <hr>
        <div id="containerOpcoes">
            <div class="opcao">
                <a href="inicioCadastroEmpresa.html" style="text-decoration: none; color: inherit;">
                    <span>Inicio</span>
                </a>
            </div>

            <div class="opcao" id="opcaoAtiva">
                <a href="contatoEmpresas.html" style="text-decoration: none; color: inherit;">
                    <span>Contatos</span>
                </a>
            </div>

            <div class="opcao">
                <a href="cadastroDeEmpresas.html" style="text-decoration: none; color: inherit;">
                    <span>Cadastrar Empresas</span>
                </a>
            </div>

            <div class="opcao">
                <a href="empresasCadastradas.html" style="text-decoration: none; color: inherit;">
                    <span>Empresas Cadastradas</span>
                </a>
            </div>
        </div>

        <div id="footerHeader">
            <div id="containerUsuario">
                <div id="usuarioFoto">
                    <img src="../imagens/fotoUsuario.png" alt="Foto do usuário">
                </div>
                <div id="user_info">
                    <a id="nomeUsuario">Gabriel Galhiardo</a>
                    <span id="cargoUsuario">Administrador</span>
                </div>
            </div>

            <div id="containerSair" onclick="sair()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z" />
                    <path fill-rule="evenodd"
                        d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z" />
                </svg>
                <a href="#" style="text-decoration: none; color: inherit;">
                    <span>Sair</span>
                </a>
            </div>
        </div>
    </header>


    <div class="containerInicio">

        <div class="conteudo" id="empresasCadastradasConteudo">

            <div class="caixaConteudoContatos">

                <div>
                    <h1 class="conteudoTitulo"><span>Contatos</span></h1>
                </div>
                <div>
                    <h4>Empresas que contataram via site institucional</h4>
                </div>

                <div class="inicioMensagens cabecalhoTabela colunas4">
                    <div>Nome Empresa</div>
                    <div>Email para contato</div>
                    <div>Telefone para contato</div>
                    <div>Data de envio</div>
                </div>

                <div id="mensagensMostradas"></div>

            </div>
        </div>

    </div>

</body>

<script>
    function preencherContatos() {
        fetch("/empresas/mensagensContatos")
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                        // plotarMensagens(resposta);

                        document.getElementById('qtd_contatos').innerText = resposta.length;
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
            });

    }

    function carregarMensagens() {
        fetch('/empresas/mensagensContatos')
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                        plotarMensagens(resposta);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
            });
    }

    function plotarMensagens(resposta) {
        console.log(resposta)

        var mensagensMostradas = document.getElementById('mensagensMostradas');
        mensagensMostradas.innerHTML = "";

        for (let i = 0; i < resposta.length; i++) {
            mensagensMostradas.innerHTML += `
        <div class="contatoLinha">
            <div>${resposta[i].nomeEmpresa}</div>
            <div>${resposta[i].email}</div>
            <div>${resposta[i].telefone}</div>
            <div>${resposta[i].dataMensagem}</div>
        </div>`
        }
    }
</script>

</html>
