      <div class="sbRodape">
        <div class="sbRodapeFundo"></div>
        <button class="sbSair" id="sbSair" type="button">

          </svg>
          <span class="sbRotulo">Sair</span>
        </button>

    <main class="containerGerenciamentoCargos">
      <div id="containerGerenciamentoCargosTitulo">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
          />
          <path d="m9 12 2 2 4-4" />
        </svg>
        <h1>Gerenciamento de Cargos</h1>
      </div>

      <section class="cartaoCargos">
        <div class="barraFerramentas">
          <h2>Cargos do Sistema</h2>

          <div class="acoesFerramentas">
            <label class="campoBusca">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                type="search"
                id="inputBuscaCargo"
                placeholder="Buscar cargo..."
                aria-label="Buscar cargo"
                oninput="buscarCargos(this.value)"
                autocomplete="off"
              />
            </label>

            <select
              id="filtroStatusCargo"
              class="campoFiltro"
              aria-label="Filtrar por status"
              onchange="filtrarCargosPorStatus(this.value)"
            >
              <option value="todos">Todos os status</option>
              <option value="ativo">Ativos</option>
              <option value="inativo">Inativos</option>
            </select>

            <button
              class="btnNovoCargo"
              type="button"
              disabled
              onclick="abrirModalCargo()"
            >
              <span>Novo Cargo</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14M12 5v14" />
              </svg>
            </button>
          </div>
        </div>

        <div class="containerTabela">
          <div class="tabelaDados">
            <div class="linhaCabecalho">
              <div class="col colCargo">Cargo</div>
              <div class="col colPermissoes">Permissões</div>
              <div class="col colUsuarios">Usuários</div>
              <div class="col colStatus">Status</div>
              <div class="col colAcoes">Ações</div>
            </div>

            <div id="listaCargos">
              <div class="estadoVazio">Carregando cargos...</div>
            </div>
          </div>
        </div>

        <div class="rodapeTabela">
          <span class="infoCargos" id="infoCargos"></span>
        </div>
      </section>
    </main>

    <div
      id="modalCargo"
      class="escondido"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tituloModalCargo"
    >
      <div id="modalCargoConteudo">
        <svg
          id="iconeFecharModalCargo"
          onclick="fecharModalCargo()"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="#6f6d82"
          viewBox="0 0 16 16"
        >
          <path
            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"
          />
        </svg>

        <h2 id="tituloModalCargo">Novo cargo</h2>

        <div class="formModal">
          <div class="campoModal">
            <label for="inputNomeCargo">NOME DO CARGO</label>
            <input
              type="text"
              id="inputNomeCargo"
              maxlength="100"
              placeholder="Ex.: Analista Júnior"
              autocomplete="off"
            />
          </div>

          <div class="campoModal">
            <label for="inputDescricaoCargo"
              >DESCRIÇÃO <span class="opcional">(opcional)</span></label
            >
            <textarea
              id="inputDescricaoCargo"
              maxlength="250"
              rows="2"
              placeholder="Para que serve esse cargo?"
            ></textarea>
            <span class="contadorCampo" id="contadorDescricao">0/250</span>
          </div>

          <div class="campoModal" id="campoStatusCargo" hidden>
            <label for="selectStatusCargo">STATUS</label>
            <select id="selectStatusCargo">
              <option value="ativo">Ativo</option>
              <option value="inativo">Inativo</option>
            </select>
          </div>

          <div class="campoModal">
            <div class="cabecalhoPermissoes">
              <label>PERMISSÕES</label>
              <span class="contadorPermissoes" id="contadorPermissoes"
                >0 selecionadas</span
              >
              <button
                type="button"
                class="btnTexto"
                id="btnSelecionarTodas"
                onclick="alternarTodasPermissoes()"
              >
                Selecionar todas
              </button>
            </div>
            <div class="gridPermissoesModal" id="gridPermissoes"></div>
          </div>

          <p class="erroModal" id="erroModalCargo" role="alert" hidden></p>
        </div>

        <div class="containerAcoesModal">
          <button id="botaoSalvarCargo" type="button" onclick="salvarCargo()">
            CADASTRAR CARGO
          </button>
          <button
            id="botaoCancelarCargo"
            type="button"
            onclick="fecharModalCargo()"
          >
            CANCELAR
          </button>
        </div>
      </div>
    </div>

    <div
      id="modalExclusaoCargo"
      class="escondido"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tituloExclusaoCargo"
    >
      <div id="modalExcluirCargo">
        <svg
          id="iconeFecharModalExclusaoCargo"
          onclick="fecharModalExclusaoCargo()"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="#6f6d82"
          viewBox="0 0 16 16"
        >
          <path
            d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"
          />
        </svg>

        <h2 id="tituloExclusaoCargo">Excluir cargo</h2>
        <p id="textoConfirmacaoExclusaoCargo"></p>
        <p class="erroModal" id="erroExclusaoCargo" role="alert" hidden></p>

        <div class="containerAcoesModal">
          <button
            id="botaoConfirmarExclusaoCargo"
            type="button"
            onclick="confirmarExclusaoCargo()"
          >
            EXCLUIR
          </button>
          <button
            id="botaoCancelarExclusaoCargo"
            type="button"
            onclick="fecharModalExclusaoCargo()"
          >
            CANCELAR
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
