<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/shortLigthLogo.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/login/senha.js"></script>
    <title>MonTech - página institucional</title>
</head>
<body>
    <main class="paginaLogin">
        <section class="esquerda">
            <div class="LogoImagem">
                <img src="../img//login/LogoLogin.svg" alt="">
            </div>
            <div class="Textos">
                <h1>BEM-VINDO A <span>MON</span>TECH</h1>
                <p>Entre para acessar seu projeto</p>
            </div>
        </section>
        <section class="direita">
            <h1>LOGIN</h1>
            <div class="campo">
                <p>Email</p>
                <div class="inputEmail inputbox">
                    <input type="text">
                </div>
            </div>
            <div class="campo">
                <p>Senha</p>
                <div class="inputSenha inputbox">
                    <input type="password">
                    <img src="../img/login/openEye.png" alt="">
                </div>
            </div>
            <button>Entrar</button>
        </section>
    </main>
</body>
</html>
