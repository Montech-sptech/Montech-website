    <main class="containerGerenciamentoServidor">
    <header>
      <h1>Gerenciamento de Servidores</h1>

      <div class="actions">
        <a href="../Captura/ScriptCaptura.sh" download="ScriptCaptura.sh" class="btn-acao botao-download">
          <span>Download Script</span>
          <img src="../img/GerenciamentoServidores/downloadIcon.svg" alt="">
        </a>

        <div id="btn-novo-servidor" class="btn-acao">
          <p>Novo Servidor</p>
          <img src="../img/GerenciamentoServidores/MaisIcon.svg" alt="">
        </div>
      </div>
    </header>
 
    <section class="servidores" id="listaServidores">

    </section>
    <div class="popup-overlay" id="popup-excluir">
        <div class="popup-excluir" role="dialog" aria-modal="true" aria-labelledby="popup-titulo">

            <button type="button" class="popup-fechar" id="popup-fechar" aria-label="Fechar popup">
              <img src="../img/Servidores/LetraXicon.svg" alt="">
            </button>

            <h2 class="popup-titulo" id="popup-titulo">
            Tem certeza que deseja excluir este servidor?
            </h2>
            <p class="popup-aviso">Esta ação é permanente e os dados associados serão removidos.</p>

            <div class="popup-confirmacao">
            <label for="input-confirmar-exclusao">Digite "excluir" para confirmar</label>
            <input type="text" id="input-confirmar-exclusao" autocomplete="off">

            <button type="button" class="btn-confirmar-exclusao" id="btn-confirmar-exclusao">Excluir servidor</button>
            </div>

        </div>
    </div>

    <div class="popup-overlay" id="popup-aviso">
        <div class="popup-excluir" role="dialog" aria-modal="true" aria-labelledby="popup-titulo">

            <button type="button" class="popup-fechar" id="popup-fechar" aria-label="Fechar popup">
              <img src="../img/Servidores/LetraXicon.svg" alt="">
            </button>

            <h2 class="popup-titulo" id="popup-titulo">
              Servidor deletado com sucesso!
            </h2>
            <p class="popup-aviso">(O servidor não poderá ser recuperado)</p>
            </div>

        </div>
    </div>
