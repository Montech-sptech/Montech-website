    <div class="containerCadastroEmpresa">
        <div id="containerCadastroEmpresaTitulo">
            <h1>Cadastrar Empresa</h1>
        </div>

        <div class="containerFormEmpresa">

            <div class="linhaCampo">
                <label for="ipt_razao_social">Razão Social</label>
                <input type="text" id="ipt_razao_social" placeholder="nome oficial da empresa">
            </div>

            <div class="linhaCampo">
                <label for="ipt_cnpj">CNPJ</label>
                <input type="text" id="ipt_cnpj" placeholder="XX.XXX.XXX/XXXX-XX">
            </div>

            <div class="linhaCampoDupla">
                <div class="linhaCampo">
                    <label for="ipt_cep">CEP</label>
                    <input type="text" id="ipt_cep" placeholder="XXXXX-XXX">
                </div>

                <div class="linhaCampo">
                    <label for="ipt_numero">Número</label>
                    <input type="text" id="ipt_numero" placeholder="ex: 100">
                </div>
            </div>

            <div class="linhaCampo">
                <label>Código da empresa</label>
                <div class="codigoGerado">
                    <span id="codigo_gerado">gerado após o cadastro</span>
                </div>
            </div>

            <div id="erro" class="mensagemErro"></div>
            <div id="sucesso" class="mensagemSucesso"></div>

            <button id="botaoCadastrarEmpresa" onclick="cadastrar()">Cadastrar Empresa</button>

        </div>
    </div>

    <script>
        function cadastrar() {
            var razaoSocial = ipt_razao_social.value;
            var cnpj = ipt_cnpj.value;
            var cep = ipt_cep.value;
            var numero = ipt_numero.value;
            var erro = document.getElementById("erro");
            var sucesso = document.getElementById("sucesso");

            erro.innerHTML = "";
            sucesso.innerHTML = "";

            if (
                razaoSocial == "" ||
                cnpj == "" ||
                cep == "" ||
                numero == ""
            ) {
                erro.innerHTML = "Há campos em branco. Por favor, preencha todos os dados.";
                return false;
            }

            fetch("/empresas/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    razaoSocialServer: razaoSocial,
                    cnpjServer: cnpj,
                    cepServer: cep,
                    numeroServer: numero
                }),
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (dados) {
                            document.getElementById("codigo_gerado").innerHTML = dados.codigo_empresa;
                            sucesso.innerHTML = "Cadastro realizado!";

                            ipt_razao_social.value = "";
                            ipt_cnpj.value = "";
                            ipt_cep.value = "";
                            ipt_numero.value = "";
                        });
                    } else {
                        resposta.text().then(texto => {
                            erro.innerHTML = "Erro ao cadastrar: " + texto;
                        });
                    }
                })
                .catch(function (err) {
                    console.log(`#ERRO: ${err}`);
                    erro.innerHTML = "Erro de conexão com o servidor.";
                });

            return false;
        }
    </script>
