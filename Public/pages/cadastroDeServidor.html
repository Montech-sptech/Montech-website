    <main class="containerCadastroServidor">
        <section class="primeira_secao">
            <div class="tituloCadastroServidor">
                <h1>Cadastrar Servidor</h1>
                <p>Registre um novo servidor para monitoramento</p>
            </div>
            <div class="EspecificacaoToken">
                <div class="especificacao">
                    <h1>ESPECIFICAÇÃO</h1>
                    <div class="especificacao_campo">
                        <div class="NomeDoServidor">
                            <h6>Nome do servidor</h6>
                            <input type="text" placeholder="SPA - ACC Brasília">
                        </div>
                        <div class="SistemaOperacional">
                            <h6>Sistema operacional</h6>
                            <select>
                                <option value="linux">Linux</option>
                                <option value="windows">Windows</option>
                            </select>
                        </div>
                    </div>
                    <div class="especificacao_campo_abaixo">
                        <div class="intervalo_campo">
                            <h6>Intervalo da coleta (segundos)</h6>
                            <input type="text" placeholder="15">
                        </div>
                    </div>
                </div>
                <div class="token">
    
                </div>
            </div>
        </section>
